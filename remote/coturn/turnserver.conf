listening-port=3478
tls-listening-port=5349
min-port=16384
max-port=65535
fingerprint
use-auth-secret
stale-nonce=600
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300
user-quota=64
total-quota=40000
max-bps=100000000
no-cli
no-multicast-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# IPv4 rules only. On coturn 4.17.2 a denied-peer-ip rule in IPv6 notation, such
# as ::-:: or ::-::ffff:ffff:ffff:ffff, denies every IPv4 peer, and then no relay
# works. Add IPv6 rules only on a server that serves IPv6 clients, after a test.
prometheus
prometheus-address=127.0.0.1
prometheus-port=9641
drain-min-allocations=0
log-file=stdout
simple-log
